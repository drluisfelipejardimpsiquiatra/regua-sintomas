<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Pré-consulta por voz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--oliva:#656635;--ambar:#E89925;--tinta:#2B2A22;--verde:#38584B;--terracota:#C3622D;--cafe:#83462D;--creme:#FBF8EE;--off:#F2F1F0;--suave:#5f5d4c;--linha:#e2dccb}
*{box-sizing:border-box}
html,body{margin:0;background:var(--oliva);color:var(--tinta);font-family:Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:620px;margin:0 auto;padding:18px 16px 48px}
.topo{color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.topo h1{font-family:Marcellus,Optima,serif;font-weight:400;font-size:22px;margin:0}
.topo small{opacity:.85;font-size:13px;text-align:right}
.barra{height:6px;background:rgba(255,255,255,.25);border-radius:4px;overflow:hidden;margin-bottom:14px}
.barra i{display:block;height:100%;width:0;background:var(--ambar);transition:width .3s}
.card{background:var(--creme);border-radius:18px;padding:20px 18px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
h2{font-family:Marcellus,Optima,serif;font-weight:400;font-size:24px;margin:0 0 8px;color:var(--oliva)}
p{line-height:1.5;margin:8px 0}
.dica{background:#fff;border:1px solid var(--linha);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--suave);margin:10px 0}
.dica ul{margin:4px 0 0;padding-left:18px}
.dica li{margin:2px 0}
label.campo{display:block;font-weight:600;margin:14px 0 4px}
input[type=text],input[type=tel],input[type=date],textarea,select{width:100%;border:1px solid var(--linha);border-radius:12px;padding:12px;font:16px Figtree,system-ui,sans-serif;background:#fff;color:var(--tinta)}
textarea{min-height:150px;resize:vertical;line-height:1.45}
textarea.gravando{border-color:var(--terracota);box-shadow:0 0 0 3px rgba(195,98,45,.18)}
.mic{display:flex;align-items:center;gap:12px;margin:12px 0 6px;flex-wrap:wrap}
.btnmic{width:64px;height:64px;border-radius:50%;border:0;background:var(--ambar);color:var(--tinta);font-size:28px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.18);flex:0 0 auto}
.btnmic.on{background:var(--terracota);color:#fff;animation:pulso 1.2s infinite}
@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(195,98,45,.5)}70%{box-shadow:0 0 0 14px rgba(195,98,45,0)}100%{box-shadow:0 0 0 0 rgba(195,98,45,0)}}
.micinfo{font-size:14px;color:var(--suave);flex:1 1 180px}
.interino{color:var(--suave);font-style:italic;font-size:15px;min-height:1.4em;margin-top:4px}
.mini{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.mini button{border:1px solid var(--linha);background:#fff;border-radius:20px;padding:7px 12px;font:600 13px Figtree,system-ui,sans-serif;color:var(--tinta);cursor:pointer}
.nav{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;border:0;border-radius:999px;padding:15px;font:700 16px Figtree,system-ui,sans-serif;cursor:pointer}
.prim{background:var(--ambar);color:var(--tinta)}
.sec{background:transparent;border:2px solid var(--linha);color:var(--tinta)}
.btn:disabled{opacity:.5}
.roteiros{display:grid;gap:10px;margin:14px 0}
.roteiros button{display:flex;align-items:center;gap:14px;text-align:left;border:2px solid var(--linha);background:#fff;border-radius:16px;padding:14px 16px;cursor:pointer;font:inherit;color:var(--tinta)}
.roteiros button:hover{border-color:var(--ambar)}
.roteiros .ic{font-size:30px;flex:0 0 auto}
.roteiros b{display:block;font-size:17px}
.roteiros small{color:var(--suave);font-size:13px}
.roteiros em{display:block;color:var(--verde);font-size:12px;font-style:normal;font-weight:700;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chips button{border:2px solid var(--linha);background:#fff;border-radius:999px;padding:9px 13px;font:600 14px Figtree,system-ui,sans-serif;color:var(--tinta);cursor:pointer}
.chips button.on{background:var(--verde);border-color:var(--verde);color:#fff}
.escala{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;margin-top:8px}
.escala button{border:1px solid var(--linha);background:#fff;border-radius:8px;padding:9px 0;font:700 14px Figtree,system-ui,sans-serif;color:var(--tinta);cursor:pointer}
.escala button.on{background:var(--oliva);border-color:var(--oliva);color:#fff}
.pontas{display:flex;justify-content:space-between;font-size:12px;color:var(--suave);margin-top:4px}
.item{border-top:1px solid var(--linha);padding:12px 0;border-radius:10px;transition:background .3s}
.item:first-of-type{border-top:0}
.item.foco{background:#f3ecd6;padding-left:8px;padding-right:8px}
.item .q{font-weight:600}
.freq{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.freq button{flex:1 1 auto;border:1px solid var(--linha);background:#fff;border-radius:10px;padding:8px 6px;font:600 13px Figtree,system-ui,sans-serif;color:var(--tinta);cursor:pointer}
.freq button.on{background:var(--oliva);border-color:var(--oliva);color:#fff}
.falarTopo{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--linha);border-radius:14px;padding:10px 12px;margin:10px 0}
.falarTopo span{font-size:14px;color:var(--suave);flex:1 1 200px}
.falar{border:0;background:var(--ambar);color:var(--tinta);border-radius:999px;padding:10px 16px;font:700 14px Figtree,system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.falar.on{background:var(--terracota);color:#fff;animation:pulso 1.2s infinite}
.falarMini{border:1px solid var(--linha);background:#fff;border-radius:999px;padding:6px 12px;font:600 13px Figtree,system-ui,sans-serif;color:var(--tinta);cursor:pointer;margin-top:8px}
.falarMini.on{background:var(--terracota);border-color:var(--terracota);color:#fff}
.ouviu{font-size:13px;color:var(--suave);font-style:italic;margin-top:4px;min-height:1.2em}
.alerta{display:none;background:#fbeee6;border:1px solid #e9c2a8;color:var(--cafe);border-radius:12px;padding:12px 14px;margin-top:10px;font-size:14px;line-height:1.45}
.alerta.sempre{display:block}
.rev{border-top:1px solid var(--linha);padding:10px 0}
.rev h3{font-size:15px;margin:0 0 4px;display:flex;justify-content:space-between;gap:8px}
.rev h3 button{border:0;background:none;color:var(--verde);font:700 13px Figtree,system-ui,sans-serif;cursor:pointer;text-decoration:underline}
.rev pre{white-space:pre-wrap;font:14px/1.45 Figtree,system-ui,sans-serif;margin:0;color:var(--suave)}
.ok{text-align:center}
.ok h2{color:var(--verde)}
.ouvirTopo{float:right;margin:0 0 8px 10px}
.ouvir{border:2px solid var(--verde);background:#fff;color:var(--verde);border-radius:999px;padding:8px 14px;font:700 14px Figtree,system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.ouvir.on{background:var(--verde);color:#fff}
.ouvirMini{border:0;background:none;font-size:16px;padding:0 6px 0 0;cursor:pointer;vertical-align:-1px}
.ouvirMini.on{filter:drop-shadow(0 0 3px var(--verde))}
.carta{background:#fff;border:1px solid var(--linha);border-left:5px solid var(--ambar);border-radius:16px;padding:18px 16px 14px;margin:0 0 18px}
.carta .cab{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.carta img{width:72px;height:72px;border-radius:50%;object-fit:cover;object-position:50% 18%;flex:0 0 auto;border:3px solid var(--creme)}
.carta h2{font-size:27px;margin:0;line-height:1.15}
.carta .cab small{display:block;color:var(--suave);font-size:13px;margin-top:2px}
.carta p{font-size:17px;line-height:1.6;margin:10px 0;padding:2px 6px;border-radius:8px;transition:background .3s}
.carta p.lendo{background:#f3ecd6}
.carta .ass{font-family:Marcellus,Optima,serif;color:var(--oliva);font-size:18px;text-align:right}
.btnCarta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:999px;padding:16px;background:var(--verde);color:#fff;font:700 17px Figtree,system-ui,sans-serif;cursor:pointer;margin:4px 0 6px}
.btnCarta.on{background:var(--terracota)}
details.cartaFechada{margin:0 0 16px}
details.cartaFechada summary{cursor:pointer;color:var(--verde);font-weight:700;font-size:15px;padding:6px 0}
.rodape{color:rgba(255,255,255,.8);font-size:12px;text-align:center;margin-top:16px;line-height:1.5}
</style>
</head>

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const MSG_MIC = "O microfone não foi liberado. Você pode digitar, ou usar o microfone do próprio teclado.";
const MSG_SILENCIO = "Ainda não ouvi nada. Fale mais perto do aparelho. Se continuar assim, o microfone escolhido pode estar errado ou mudo (no computador: cadeado ao lado do endereço → Microfone).";
const MSG_SEM_SOM = "Não está chegando som do microfone. Confira se o microfone certo está escolhido (no computador: cadeado ao lado do endereço → Microfone). Enquanto isso, você pode digitar.";
let rec = null, gravando = false, alvo = null, interinoEl = null, btnAtual = null, base = "";
// No computador, o microfone padrão pode estar mudo (ex.: mesa de som desligada).
// Mede rapidamente cada entrada e usa a que tem som. Celular: usa o padrão.
const MOVEL = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
let trilha = null, nomeMic = "";
async function pico(track, ms = 250){
  const ac = new (window.AudioContext || window.webkitAudioContext)(); const an = ac.createAnalyser();
  ac.createMediaStreamSource(new MediaStream([track])).connect(an);
  const d = new Float32Array(2048); let mx = 0; const fim = Date.now() + ms;
  while (Date.now() < fim) { await new Promise(r => setTimeout(r, 50)); an.getFloatTimeDomainData(d); for (const x of d) mx = Math.max(mx, Math.abs(x)); }
  ac.close(); return mx;
}
async function escolherTrilha(){
  if (MOVEL || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return null;
  if (trilha && trilha.readyState === "live") return trilha;
  try {
    const s0 = await navigator.mediaDevices.getUserMedia({audio:true});
    const t0 = s0.getAudioTracks()[0];
    if (await pico(t0) > 1e-4) { trilha = t0; nomeMic = t0.label; return trilha; }
    const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "audioinput" && !["default","communications"].includes(d.deviceId));
    let melhor = null, mp = 0;
    for (const d of devs) {
      try { const s = await navigator.mediaDevices.getUserMedia({audio:{deviceId:{exact:d.deviceId}}}); const t = s.getAudioTracks()[0]; const p = await pico(t);
        if (p > mp) { if (melhor) melhor.stop(); melhor = t; mp = p; } else t.stop(); } catch(e) {}
    }
    if (melhor && mp > 1e-4) { t0.stop(); trilha = melhor; nomeMic = melhor.label; return trilha; }
    trilha = t0; nomeMic = t0.label; return trilha;
  } catch(e) { return null; }
}
function ligarRec(r, trk){ if (trk) { try { r.start(trk); return; } catch(e) {} } r.start(); }
function pararVoz(){ if (rec && gravando) { gravando = false; try{ rec.stop(); }catch(e){} } gravando = false; if (btnAtual){ btnAtual.classList.remove("on"); btnAtual.textContent="🎤"; } if (alvo) alvo.classList.remove("gravando"); if (interinoEl) interinoEl.textContent=""; }
async function iniciarVoz(textarea, btn, interino){
  if (!SR) return;
  pararVoz(); pararFala(); pararConversa();
  if (!trilha && !MOVEL) interino.textContent = "Preparando o microfone…";
  const trk = await escolherTrilha();
  rec = new SR(); rec.lang = "pt-BR"; rec.continuous = true; rec.interimResults = true;
  alvo = textarea; btnAtual = btn; interinoEl = interino; base = textarea.value.trim();
  rec.onresult = ev => {
    let fin = "", tmp = "";
    for (let i = ev.resultIndex; i < ev.results.length; i++) { const t = ev.results[i][0].transcript; if (ev.results[i].isFinal) fin += t; else tmp += t; }
    if (fin) { fin = fin.trim(); fin = fin.charAt(0).toUpperCase() + fin.slice(1);
      base = (base ? base + (/[.!?]$/.test(base) ? " " : ". ") : "") + fin;
      textarea.value = base; textarea.dispatchEvent(new Event("input")); }
    interino.textContent = tmp;
  };
  let teveAudio = false, falhas = 0;
  rec.onaudiostart = () => { teveAudio = true; falhas = 0; };
  rec.onerror = ev => {
    if (ev.error === "no-speech") { interino.textContent = MSG_SILENCIO; return; }
    if (ev.error === "aborted") return;
    pararVoz();
    interino.textContent = ev.error === "network" ? "O reconhecimento de voz precisa de internet. Confira a conexão, ou digite." : MSG_MIC;
  };
  rec.onend = () => {
    if (!gravando) return;
    if (!teveAudio && ++falhas >= 2) { pararVoz(); interino.textContent = MSG_SEM_SOM; return; }
    teveAudio = false;
    try { ligarRec(rec, trk); } catch(e) { pararVoz(); }
  };
  try { ligarRec(rec, trk); gravando = true; btn.classList.add("on"); btn.textContent = "■"; textarea.classList.add("gravando"); interino.textContent = "Ouvindo…" + (nomeMic && !MOVEL ? ` (microfone: ${nomeMic})` : ""); }
  catch(e) { interino.textContent = "Não consegui ligar o microfone. Você pode digitar."; }
}

// ====== OUVIR (leitura em voz alta) ======
const TTS = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let vozPt = null, falandoBtn = null;
function escolherVoz(){ if (!TTS) return; const all = speechSynthesis.getVoices(); const vs = all.filter(v => /^pt(-|_)?BR/i.test(v.lang) || /portugu[eê]s.*brasil/i.test(v.name));
  vozPt = vs.find(v => /google|luciana|francisca|natural|online/i.test(v.name)) || vs[0] || all.find(v => /^pt/i.test(v.lang)) || null; }
if (TTS) { escolherVoz(); speechSynthesis.onvoiceschanged = escolherVoz; }
function pararFala(){ if (TTS) speechSynthesis.cancel(); if (falandoBtn) { falandoBtn.classList.remove("on"); falandoBtn.innerHTML = falandoBtn.dataset.rotulo; } falandoBtn = null; }
function utter(txt){ const u = new SpeechSynthesisUtterance(txt); u.lang = "pt-BR"; if (vozPt) u.voice = vozPt; u.rate = 0.95; return u; }
function falar(partes, btn){
  if (!TTS) return;
  if (falandoBtn === btn) { pararFala(); return; }
  pararFala(); pararVoz(); pararConversa(); pararCarta(true);
  falandoBtn = btn; btn.classList.add("on"); btn.innerHTML = btn.classList.contains("ouvirMini") ? "■" : "■ Parar";
  const lista = partes.filter(Boolean);
  lista.forEach((txt, k) => { const u = utter(txt); if (k === lista.length - 1) u.onend = () => { if (falandoBtn === btn) pararFala(); }; speechSynthesis.speak(u); });
}
const falarP = txt => new Promise(res => { if (!TTS || !txt) return res(); const u = utter(txt); u.onend = res; u.onerror = res; speechSynthesis.speak(u); });
const limpo = h => String(h).replace(/<[^>]+>/g, "").replace(/\s+/g, " ").trim();
function btnOuvir(id){ return TTS ? `<button class="ouvir" id="${id}" data-rotulo="🔊 Ouvir">🔊 Ouvir</button>` : ""; }

// ====== LEITURA DA MENSAGEM (destaca o parágrafo que está sendo lido) ======
let cartaId = 0, cartaPos = 0, cartaAudio = null;
const ROT_CARTA = "▶ Ouvir a mensagem";
function pararCarta(guardar){
  cartaId++; if (cartaAudio) cartaAudio.pause(); else if (TTS) speechSynthesis.cancel();
  if (!guardar) cartaPos = 0;
  document.querySelectorAll(".carta p.lendo").forEach(p => p.classList.remove("lendo"));
  const b = document.getElementById("btnCarta"); if (b) { b.classList.remove("on"); b.textContent = cartaPos ? "▶ Continuar ouvindo" : ROT_CARTA; }
}
async function tocarCarta(btn){
  if (btn.classList.contains("on")) { pararCarta(true); return; }
  pararVoz(); pararFala(); pararConversa();
  btn.classList.add("on"); btn.textContent = "⏸ Pausar";
  if (AUDIO_CARTA) {
    if (!cartaAudio) { cartaAudio = new Audio(AUDIO_CARTA); cartaAudio.onended = () => { cartaPos = 0; pararCarta(); }; }
    try { await cartaAudio.play(); } catch(e) { pararCarta(true); }
    return;
  }
  const meu = ++cartaId, ps = [...document.querySelectorAll(".carta p")];
  for (; cartaPos < ps.length && meu === cartaId; cartaPos++) {
    ps.forEach(p => p.classList.remove("lendo")); ps[cartaPos].classList.add("lendo");
    await falarP(ps[cartaPos].textContent);
  }
  if (meu === cartaId) { cartaPos = 0; pararCarta(); }
}

// ====== RESPONDER FALANDO (perguntas de toque) ======
let conversaId = 0, escutaRec = null;
function pararConversa(){ conversaId++; if (escutaRec) { try { escutaRec.abort(); } catch(e){} escutaRec = null; } if (TTS) speechSynthesis.cancel();
  document.querySelectorAll(".falar.on,.falarMini.on").forEach(b => { b.classList.remove("on"); b.innerHTML = b.dataset.rotulo; });
  document.querySelectorAll(".item.foco").forEach(e => e.classList.remove("foco")); }
// Escuta uma resposta curta; resolve com o texto ("" se nada).
async function escutarP(statusEl, ms = 9000){
  const trk = await escolherTrilha();
  return new Promise(res => {
    if (!SR) return res("");
    const r = new SR(); escutaRec = r; r.lang = "pt-BR"; r.continuous = false; r.interimResults = true; r.maxAlternatives = 3;
    let fim = "", feito = false, teveAudio = false, semFala = false;
    r.onaudiostart = () => { teveAudio = true; };
    const acabar = () => { if (feito) return; feito = true; clearTimeout(tm);
      if (!teveAudio && statusEl) { statusEl.textContent = MSG_SEM_SOM; pararConversa(); }
      else if (!fim.trim() && semFala && statusEl) statusEl.textContent = MSG_SILENCIO;
      res(fim.trim()); };
    r.onresult = ev => { let tmp = ""; for (let i = 0; i < ev.results.length; i++) { const t = [...ev.results[i]].map(a => a.transcript).join(" | ");
        if (ev.results[i].isFinal) fim += " " + t; else tmp += t; } if (statusEl) statusEl.textContent = "Ouvi: " + (fim + " " + tmp).replace(/ \| .*/g,"").trim(); };
    r.onerror = ev => { if (ev.error === "no-speech") semFala = true; if (statusEl && ["not-allowed","service-not-allowed","audio-capture"].includes(ev.error)) statusEl.textContent = MSG_MIC; };
    r.onend = acabar;
    const tm = setTimeout(() => { try { r.stop(); } catch(e) { acabar(); } }, ms);
    try { ligarRec(r, trk); if (statusEl) statusEl.textContent = "Ouvindo…"; } catch(e) { acabar(); }
  });
}
function parseFreq(t){ t = norm(t); if (!t) return null;
  if (/muito leve|pouquinho|raramente|um ou dois dias|1 ou 2 dias/.test(t)) return 1;
  if (/moderad|metade/.test(t)) return 3;
  if (/grave|quase todos|todos os dias|todo dia|sempre|muito forte|demais/.test(t)) return 4;
  if (/\bleve\b|leves|alguns dias|varios dias|as vezes/.test(t)) return 2;
  if (/\bnada\b|nunca|nenhum|\bnao\b|zero/.test(t)) return 0;
  return null; }
const NUMS = {zero:0,um:1,uma:1,dois:2,duas:2,tres:3,quatro:4,cinco:5,seis:6,meia:6,sete:7,oito:8,nove:9,dez:10};
function parseNum(t){ t = norm(t); const d = t.match(/\b(10|[0-9])\b/); if (d) return +d[1]; for (const w of t.split(/[^a-z]+/)) if (w in NUMS) return NUMS[w]; return null; }
function parseAreas(t, areas){ t = norm(t); return areas.filter(a => norm(a).split(/[^a-z]+/).filter(w => w.length > 3).some(w => t.includes(w.slice(0, Math.max(5, w.length - 2))))); }

async function conversaRastreio(btn){

  for (let i = 0; i < itens.length && vivo(); i++) {
    if ((R.rastreio || {})[i] != null) continue;
    const el = document.querySelector(`.freq[data-q="${i}"]`).closest(".item");
    document.querySelectorAll(".item.foco").forEach(e => e.classList.remove("foco")); el.classList.add("foco");
    el.scrollIntoView({behavior:"smooth", block:"center"});

      await falarP(tent ? "Não entendi. Diga: nada, muito leve, leve, moderado ou grave." : itens[i] + "?");
      if (!vivo()) break;
      const ouvido = await escutarP(st);
      v = parseFreq(ouvido);
    }
    if (!vivo()) break;
    if (v != null) { el.querySelector(`[data-f="${v}"]`).click(); st.textContent = `Marquei: ${FREQ_CURTO[v]}`;
      if (i === rot.risco && v > 0) await falarP(limpo(CVV)); }

    msg.textContent = "Não consegui enviar (sem internet?). As respostas continuam guardadas neste aparelho; tente de novo em instantes.";
  }
}
render();
</script>
