<style>
/* Pré-consulta por voz. Base: Guia de Marca Simple But (tema Claro, cabeçalho oliva).
   Uma etapa por tela; perguntas abertas com microfone e transcrição editável; envio para o
   Google Formulário "Questionário de pré-consulta – versão 10/2026" (mesma planilha de sempre). */
:root{
  --cafe:#83462D; --terracota:#C3622D; --ambar:#E89925; --oliva-dourado:#88764F; --oliva:#656635;
  --verde-floresta:#38584B; --off-white:#F2F1F0; --branco:#FFFFFF;
  --paper:#F7F6F3; --paper-2:#EDEBE6; --ink:#2B2A22; --soft:#5E5A4C; --line:#D9D6CC;
  --on-dark:#F2F1F0; --on-dark-soft:#DAD7CB;
  --alert-bg:#F7E6DA; --alert-line:#E9C9B4;
  --f-display:"Optima LT Pro",Optima,"Optima nova","Marcellus",Candara,serif;
  --f-body:Garet,"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--oliva)}
h1,h2,h3{font-family:var(--f-display);font-weight:500;margin:0;text-wrap:balance}
p{margin:0}
.in{max-width:680px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--oliva);color:var(--on-dark)}
header.top .in{display:flex;align-items:center;gap:12px;min-height:58px}
header.top svg{width:13px;height:18px;fill:var(--ambar);flex:none}
header.top b{font:500 17px var(--f-display);margin-right:auto}
header.top span{font:600 10.5px var(--f-body);letter-spacing:.18em;text-transform:uppercase;color:var(--on-dark-soft)}
.barra{height:4px;background:rgba(242,241,240,.18)}
.barra i{display:block;height:100%;width:0;background:var(--ambar);transition:width .3s}
main{padding-block:28px 120px}
.rot{font:600 11px/1.4 var(--f-body);letter-spacing:.22em;text-transform:uppercase;color:var(--cafe)}
.etapa-tit{font-size:clamp(28px,6vw,36px);line-height:1.12;margin:8px 0 6px}
.etapa-sub{color:var(--soft);font-size:15px}
.cartao{background:var(--branco);border:1px solid var(--line);border-radius:12px;padding:18px 16px;margin-top:14px}
.q-tit{font-weight:600;font-size:16px;line-height:1.4}
.q-tit .obr{color:var(--cafe);font-weight:700}
.q-desc{font-size:14px;color:var(--soft);margin-top:4px}
.q-erro{display:none;font-size:13.5px;color:var(--cafe);font-weight:600;margin-top:8px}
.cartao.erro{border-color:var(--cafe)}
.cartao.erro .q-erro{display:block}
textarea,input[type=text],input[type=email],input[type=tel],input[type=date]{width:100%;font:16px var(--f-body);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-top:10px}
textarea{min-height:92px;resize:vertical;line-height:1.5}
textarea:focus,input:focus{outline:2px solid var(--ambar);outline-offset:1px;background:#fff}
.voz{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.mic{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--verde-floresta);background:#fff;color:var(--verde-floresta);font:600 14px var(--f-body);cursor:pointer}
.mic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mic.on{background:var(--terracota);border-color:var(--terracota);color:#fff}
.mic.on .ponto{display:inline-block}
.ponto{display:none;width:9px;height:9px;border-radius:50%;background:#fff;animation:pulsa 1s infinite}
@keyframes pulsa{50%{opacity:.25}}
.ouvindo{font-size:13.5px;color:var(--soft);font-style:italic;min-height:1em}
.dica-teclado{font-size:13px;color:var(--soft);margin-top:8px}
.ops{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.op{border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:10px 13px;font:500 15px/1.25 var(--f-body);cursor:pointer;text-align:left}
.op[aria-pressed="true"]{background:var(--verde-floresta);border-color:var(--verde-floresta);color:#fff}
.escala{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px;margin-top:12px}
.escala .op{padding:10px 0;text-align:center;font-weight:600}
.escala-legenda{display:flex;justify-content:space-between;font-size:12.5px;color:var(--soft);margin-top:6px}
.freq{display:grid;gap:6px;margin-top:12px}
.freq .op{width:100%}
.outro{display:none}
.outro.vis{display:block}
.alerta{display:none;background:var(--alert-bg);border:1px solid var(--alert-line);color:var(--cafe);border-radius:10px;padding:12px 14px;margin-top:12px;font-size:14.5px}
.alerta.vis{display:block}
.pular{margin-top:16px;display:flex;gap:10px;align-items:center;background:var(--paper-2);border-radius:10px;padding:12px 14px;font-size:15px}
.pular input{width:20px;height:20px;accent-color:var(--verde-floresta)}
nav.passos{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(247,246,243,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);backdrop-filter:blur(6px)}
nav.passos .in{display:flex;gap:10px;align-items:center;min-height:70px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:999px;font:600 13px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;border:1px solid transparent;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--ambar);color:var(--ink);margin-left:auto}
.btn.sec{background:transparent;border-color:var(--line);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.salvo{font-size:12.5px;color:var(--soft)}
.capa{display:grid;gap:16px}
.capa h1{font-size:clamp(32px,8vw,44px);line-height:1.08}
.capa ul{margin:0;padding:0;list-style:none;border-top:1px solid var(--line)}
.capa li{padding:12px 0;border-bottom:1px solid var(--line);font-size:15.5px;display:grid;grid-template-columns:26px 1fr;gap:8px}
.capa li b{font:500 18px var(--f-display);color:var(--cafe)}
.nota{font-size:14px;color:var(--soft)}
.aviso{background:var(--paper-2);border-radius:10px;padding:14px 16px;font-size:14.5px;color:var(--ink)}
.crise{font-size:14px;color:var(--soft)}
.crise b{color:var(--ink)}
.rev-bloco{margin-top:22px}
.rev-bloco h3{font-size:22px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rev-bloco h3 button{font:600 12px var(--f-body);letter-spacing:.12em;text-transform:uppercase;background:none;border:0;color:var(--cafe);cursor:pointer;text-decoration:underline}
.rev-item{padding:10px 0;border-bottom:1px solid var(--line)}
.rev-item p{font-size:13.5px;color:var(--soft)}
.rev-item div{font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.rev-item div.vazio{color:#9a9688;font-style:italic}
.fim{text-align:center;display:grid;gap:14px;justify-items:center;padding-top:30px}
.fim svg{width:30px;height:42px;fill:var(--ambar)}
.fim h1{font-size:34px}
.carta{background:var(--branco);border:1px solid var(--line);border-left:5px solid var(--ambar);border-radius:16px;padding:18px 16px 14px}
.carta .cab{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.carta img{width:72px;height:72px;border-radius:50%;object-fit:cover;object-position:50% 18%;flex:0 0 auto}
.carta h2{font-size:27px;color:var(--oliva);line-height:1.15}
.carta .cab small{display:block;color:var(--soft);font-size:13px;margin-top:2px}
.carta p{font-size:17px;line-height:1.6;margin:10px 0;padding:2px 6px;border-radius:8px;transition:background .3s}
.carta p.lendo{background:var(--paper-2)}
.carta .ass{font-family:var(--f-display);color:var(--oliva);font-size:18px;text-align:right}
.btnCarta{display:flex;align-items:center;justify-content:center;width:100%;border:0;border-radius:999px;padding:16px;background:var(--verde-floresta);color:#fff;font:700 17px var(--f-body);cursor:pointer;margin:4px 0 6px}
.btnCarta.on{background:var(--terracota)}
details.cartaFechada summary{cursor:pointer;color:var(--verde-floresta);font-weight:700;font-size:15px;padding:6px 0}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const TTS = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;

function escolherVoz() { if (!TTS) return; const all = speechSynthesis.getVoices(), vs = all.filter((v) => /^pt(-|_)?BR/i.test(v.lang));

const falarP = (txt) => new Promise((res) => { if (!TTS || !txt) return res(); const u = new SpeechSynthesisUtterance(txt); u.lang = "pt-BR"; if (vozPt) u.voice = vozPt; u.rate = 0.95; u.onend = res; u.onerror = res; speechSynthesis.speak(u); });

/* ---------- reconhecimento de voz ---------- */
// O texto aparece na caixa enquanto a pessoa fala (não espera a "frase concluída",
// que o iPhone muitas vezes nunca marca). No celular, cada trecho de fala é uma
// sessão curta que reinicia sozinha; no computador, a escuta é contínua.
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const MOVEL = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
let rec = null, recAlvo = null, recLigado = false, recBase = "", recSessao = "";
const juntarFala = (base, txt) => {
  txt = String(txt || "").replace(/\s+/g, " ").trim(); base = String(base || "").replace(/\s+$/, "");
  if (!txt) return base;
  if (!base || /[.!?]$/.test(base)) txt = txt.charAt(0).toUpperCase() + txt.slice(1);
  return (base ? base + " " : "") + txt;
};
function botaoMic(on) {
  document.querySelectorAll(".mic").forEach((b) => { const ativo = on && +b.dataset.mic === recAlvo; b.classList.toggle("on", ativo); b.querySelector(".rotulo").textContent = ativo ? "Parar" : "Falar"; });
}
function gravarFala(e) {
  const txt = juntarFala(recBase, recSessao);
  S.resp[e] = txt; salvar();
  const ta = $("q" + e); if (ta && ta.value !== txt) ta.value = txt;
}
function pararVoz() {
  const e = recAlvo;
  recLigado = false;
  if (rec) { try { rec.stop(); } catch (err) {} }
  if (e != null && recSessao) { recBase = juntarFala(recBase, recSessao); recSessao = ""; gravarFala(e); }
  botaoMic(false);
  document.querySelectorAll(".ouvindo").forEach((o) => (o.textContent = ""));
}
function iniciarVoz(e, btn) {
  if (!SR) return;
  if (recLigado && recAlvo === e) { pararVoz(); return; }
  pararVoz();
  const ta = $("q" + e), ouv = $("o" + e);
  recAlvo = e; recLigado = true; recBase = ta.value; recSessao = "";
  let ouviuAlgo = false, reinicios = 0;
  const novo = () => {
    const r = new SR(); r.lang = "pt-BR"; r.continuous = !MOVEL; r.interimResults = true;
    let nFin = 0; // frases já concluídas nesta sessão (gravadas de vez)
    r.onresult = (ev) => {
      if (r !== rec || !recLigado) return;
      let t = "";
      for (let i = 0; i < ev.results.length; i++) {
        const tr = ev.results[i][0].transcript;
        if (ev.results[i].isFinal) { if (i >= nFin) { recBase = juntarFala(recBase, tr); nFin = i + 1; } }
        else t += " " + tr;
      }
      recSessao = t; ouviuAlgo = true; reinicios = 0; gravarFala(e);
      ouv.textContent = "Ouvindo… pode continuar falando";
    };
    r.onerror = (ev) => {
      if (r !== rec) return;
      if (ev.error === "not-allowed" || ev.error === "service-not-allowed") {
        ouv.textContent = ouviuAlgo ? "O microfone pausou. Toque em Falar para continuar." : "O microfone não foi liberado. Permita o acesso ao microfone, ou toque no campo e use o microfone do teclado.";
        recLigado = false;
      } else if (ev.error === "network") { ouv.textContent = "O reconhecimento de voz precisa de internet. Confira a conexão ou digite."; recLigado = false; }
      else if (ev.error === "audio-capture") { ouv.textContent = "Não encontrei o microfone. Toque no campo e use o microfone do teclado."; recLigado = false; }
    };
    r.onend = () => {
      if (r !== rec) return;
      if (recSessao) { recBase = juntarFala(recBase, recSessao); recSessao = ""; gravarFala(e); }
      if (recLigado && recAlvo === e && ++reinicios <= 8) {
        try { rec = novo(); rec.start(); return; } catch (err) {}
      }
      if (recLigado && reinicios > 8) ouv.textContent = "Parei de ouvir por silêncio. Toque em Falar para continuar.";
      recLigado = false; botaoMic(false);
    };
    return r;
  };
  rec = novo();
  try { rec.start(); botaoMic(true); ouv.textContent = "Ouvindo… pode falar"; }
  catch (err) { recLigado = false; botaoMic(false); ouv.textContent = "Não consegui ligar o microfone. Toque no campo e use o microfone do teclado."; }
}

    : `<input id="q${q.e}" data-e="${q.e}" type="${tipo}" value="${esc(v)}" ${tipo === "tel" ? 'inputmode="tel" autocomplete="tel"' : ""}>`;
  const usaVoz = longo && SR;
  return campo + (usaVoz ? `<div class="voz"><button type="button" class="mic" data-mic="${q.e}">${MIC_SVG}<span class="ponto"></span><span class="rotulo">Falar</span></button><span class="ouvindo" id="o${q.e}"></span></div>` : longo ? `<p class="dica-teclado">Para falar em vez de digitar, toque no campo e use o microfone do teclado do celular.</p>` : "");
}
function campoData(q) {
  return `<input id="q${q.e}" data-e="${q.e}" type="date" value="${esc(S.resp[q.e] || "")}">`;
}
function campoOpcoes(q) {
  const multi = q.t === "check", atual = S.resp[q.e];
  const sel = (o) => multi ? Array.isArray(atual) && atual.includes(o) : atual === o;
  const grade = Object.keys(FREQ_CURTA).includes(q.o[0]);
  let h = `<div class="${grade ? "freq" : "ops"}" role="group">` + q.o.map((o) =>
    `<button type="button" class="op" data-op="${q.e}" data-v="${esc(o)}" aria-pressed="${sel(o)}">${esc(grade ? FREQ_CURTA[o] : o)}</button>`).join("");
  if (q.x) h += `<button type="button" class="op" data-op="${q.e}" data-v="__other_option__" aria-pressed="${sel("__other_option__")}">Outro</button>`;
  h += "</div>";
  if (q.x) h += `<div class="outro ${sel("__other_option__") ? "vis" : ""}" id="outro${q.e}"><input type="text" data-outro="${q.e}" placeholder="Qual?" value="${esc(S.resp[q.e + ".outro"] || "")}"></div>`;
  if (q.e === RISCO) h += `<div class="alerta ${atual && atual !== q.o[0] ? "vis" : ""}" id="alertaRisco"><b>Obrigado por contar.</b> O Dr. Luis Felipe vai ver isso com atenção. Se esses pensamentos estiverem fortes agora, não espere a consulta: ligue <b>188</b> (CVV, 24 horas, gratuito), <b>192</b> (SAMU) ou procure o pronto-atendimento mais próximo.</div>`;
  return h;
}
function campoEscala(q) {
  const leg = LEG_ESCALA[q.e] || ["0", "10"];
  return `<div class="escala" role="group">` + q.o.map((o) => `<button type="button" class="op" data-op="${q.e}" data-v="${o}" aria-pressed="${S.resp[q.e] === o}">${o}</button>`).join("") +
    `</div><div class="escala-legenda"><span>${esc(leg[0])}</span><span>${esc(leg[1])}</span></div>`;
}
function cartao(q) {
  const corpo = q.t === "text" || q.t === "para" ? campoTexto(q) : q.t === "date" ? campoData(q) : q.t === "scale" ? campoEscala(q) : campoOpcoes(q);
  const dica = DICAS[q.e] ? `<p class="q-desc">${esc(DICAS[q.e])}</p>` : "";
  return `<div class="cartao" id="c${q.e}"><p class="q-tit">${esc(q.q)}${q.r ? ' <span class="obr" aria-label="obrigatória">*</span>' : ""}</p>${dica}${corpo}<p class="q-erro">Esta resposta é necessária para enviar.</p></div>`;
}

/* ---------- telas ---------- */
function capa() {
  const tem = Object.keys(S.resp).length > 0;
  $("nav").hidden = true; $("progresso").style.width = "0"; $("contador").textContent = "Pré-consulta";
  $("tela").innerHTML = `<section class="capa">
    ${cartaHtml(tem)}
    <p class="rot">Antes da sua primeira consulta</p>
    <h1>Conte a sua história do seu jeito</h1>
    <p class="nota" style="font-size:16px">Estas perguntas me ajudam a chegar à consulta já conhecendo o que você vive. Assim aproveitamos melhor o nosso tempo juntos.</p>
    <ul>
      <li><b>1</b><span>Nas perguntas abertas, toque em <strong>Falar</strong> e responda em voz alta. O texto aparece na hora.</span></li>
      <li><b>2</b><span>Se alguma palavra sair errada, corrija ali mesmo, digitando.</span></li>
      <li><b>3</b><span>As perguntas de marcar são só um toque. No final você revisa tudo antes de enviar.</span></li>
    </ul>
    <p class="aviso">Leva de 20 a 30 minutos. Você pode parar e continuar depois: o que já respondeu fica guardado neste celular até o envio. Muitos temas são delicados e só as perguntas com <b>*</b> são obrigatórias.</p>
    <p class="nota">A transcrição usa o serviço de voz do próprio celular (Google ou Apple). O consultório não guarda gravações: recebe apenas o texto que você revisou, sob sigilo médico e conforme a LGPD.</p>
    <label class="cartao" for="email" style="display:block">
      <span class="q-tit">Seu e-mail <span class="obr">*</span></span>
      <input type="email" id="email" autocomplete="email" inputmode="email" value="${esc(S.email)}" placeholder="voce@exemplo.com">
      <span class="q-erro" id="emailErro">Informe um e-mail válido para continuar.</span>
    </label>
    <button class="btn pri" type="button" id="comecar" style="margin-left:0;justify-self:start">${tem ? "Continuar de onde parei" : "Começar"}</button>
    ${tem ? '<button class="btn sec" type="button" id="recomecar" style="justify-self:start">Apagar respostas e recomeçar</button>' : ""}
    <p class="crise">Em crise, não espere a consulta: ligue <b>188</b> (CVV, 24 horas) ou <b>192</b> (SAMU), ou procure o pronto-atendimento mais próximo.</p>
  </section>`;
  const bc = $("btnCarta"); if (bc) bc.onclick = () => tocarCarta(bc);
  $("email").addEventListener("input", (ev) => { S.email = ev.target.value.trim(); salvar(); });
  $("comecar").onclick = () => {
    const ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(S.email);
    $("emailErro").style.display = ok ? "none" : "block";
    if (!ok) { $("email").focus(); return; }
    ir(S.etapa >= 0 && S.etapa < TOTAL ? S.etapa : 0);
  };
  const r = $("recomecar"); if (r) r.onclick = () => { S = { etapa: -1, resp: {}, pularMulher: false, email: S.email }; salvar(); capa(); };
}
function ir(n) {
  pararVoz(); pararCarta();
  if (n === MULHER && S.pularMulher === true && n !== S.etapa) { /* mostra mesmo assim, com a opção marcada */ }
  S.etapa = n; salvar();
  if (n >= TOTAL) return revisao();
  const st = STEPS[n];
  $("contador").textContent = `Etapa ${n + 1} de ${TOTAL}`;
  $("progresso").style.width = ((n) / TOTAL * 100) + "%";
  $("nav").hidden = false; $("voltar").hidden = false;
  $("avancar").textContent = n === TOTAL - 1 ? "Revisar" : "Continuar";
  let h = `<p class="rot">Etapa ${n + 1} de ${TOTAL}</p><h2 class="etapa-tit">${esc(st.n)}</h2>`;
  if (n === 2) h += `<p class="etapa-sub">Nas últimas <b>duas semanas</b>, o quanto você foi incomodado(a) por cada um destes problemas?</p>`;
  if (n === MULHER) h += `<label class="pular"><input type="checkbox" id="pular" ${S.pularMulher ? "checked" : ""}> Esta etapa não se aplica a mim</label>`;
  const qs = n === 2 ? st.q.map((q, i) => i === 0 ? Object.assign({}, q, { q: "Pouco interesse ou prazer em fazer as coisas?" }) : q) : st.q;
  h += `<div id="qs" ${n === MULHER && S.pularMulher ? "hidden" : ""}>` + qs.map(cartao).join("") + "</div>";
  $("tela").innerHTML = h;
  window.scrollTo(0, 0);
  const p = $("pular"); if (p) p.onchange = () => { S.pularMulher = p.checked; $("qs").hidden = p.checked; salvar(); };
}
function valida(n) {
  if (n === MULHER && S.pularMulher) return true;
  let primeiro = null;
  STEPS[n].q.forEach((q) => {
    const c = $("c" + q.e); if (!c) return;
    const v = S.resp[q.e];
    const vazio = !q.r ? false : Array.isArray(v) ? v.length === 0 : !String(v || "").trim();
    c.classList.toggle("erro", vazio);
    if (vazio && !primeiro) primeiro = c;
  });
  if (primeiro) { primeiro.scrollIntoView({ behavior: "smooth", block: "center" }); return false; }
  return true;
}
function textoResp(q) {
  if (STEPS[MULHER].q.includes(q) && S.pularMulher) return "";
  const v = S.resp[q.e];
  if (Array.isArray(v)) return v.map((x) => x === "__other_option__" ? "Outro: " + (S.resp[q.e + ".outro"] || "") : x).join(" · ");
  if (v === "__other_option__") return "Outro: " + (S.resp[q.e + ".outro"] || "");
  if (q.t === "date" && v) { const [a, m, d] = v.split("-"); return `${d}/${m}/${a}`; }
  return v ? (FREQ_CURTA[v] || v) : "";
}
function revisao() {
  pararVoz();
  $("contador").textContent = "Revisão"; $("progresso").style.width = "100%";
  $("nav").hidden = false; $("avancar").textContent = "Enviar ao Dr. Luis Felipe";
  let h = `<p class="rot">Quase lá</p><h2 class="etapa-tit">Revise as suas respostas</h2><p class="etapa-sub">Se quiser mudar algo, toque em "Editar" na etapa. Quando estiver tudo certo, envie.</p>`;
  h += `<div class="rev-bloco"><h3>Contato</h3><div class="rev-item"><p>E-mail</p><div>${esc(S.email)}</div></div></div>`;
  STEPS.forEach((st, i) => {
    if (i === MULHER && S.pularMulher) { h += `<div class="rev-bloco"><h3>${esc(st.n)} <button type="button" data-edit="${i}">Editar</button></h3><div class="rev-item"><div class="vazio">Não se aplica</div></div></div>`; return; }
    h += `<div class="rev-bloco"><h3>${esc(st.n)} <button type="button" data-edit="${i}">Editar</button></h3>` +
      st.q.map((q) => { const t = textoResp(q); return `<div class="rev-item"><p>${esc(q.q)}</p><div class="${t ? "" : "vazio"}">${t ? esc(t) : "Sem resposta"}</div></div>`; }).join("") + "</div>";
  });
  h += `<p class="crise" style="margin-top:22px">Suas respostas vão só para o Dr. Luis Felipe e ficam no seu registro médico, sob sigilo.</p>`;
  $("tela").innerHTML = h; window.scrollTo(0, 0);
}
async function enviar() {
  for (let i = 0; i < TOTAL; i++) {
    const faltando = !(i === MULHER && S.pularMulher) && STEPS[i].q.some((q) => q.r && !String(S.resp[q.e] || "").trim());
    if (faltando) { ir(i); setTimeout(() => valida(i), 50); return; }
  }
  const b = $("avancar"); b.disabled = true; b.textContent = "Enviando…";
  const fd = new URLSearchParams();
  fd.append("emailAddress", S.email);
  STEPS.forEach((st, i) => st.q.forEach((q) => {
    if (i === MULHER && S.pularMulher) return;
    const v = S.resp[q.e];
    if (v == null || v === "" || (Array.isArray(v) && !v.length)) return;
    if (q.t === "date") { const [a, m, d] = v.split("-"); fd.append(`entry.${q.e}_year`, a); fd.append(`entry.${q.e}_month`, String(+m)); fd.append(`entry.${q.e}_day`, String(+d)); return; }
    (Array.isArray(v) ? v : [v]).forEach((x) => fd.append(`entry.${q.e}`, x));
    const outro = S.resp[q.e + ".outro"];
    if ((Array.isArray(v) ? v.includes("__other_option__") : v === "__other_option__") && outro) fd.append(`entry.${q.e}.other_option_response`, outro);
  }));
  fd.append("fvv", "1"); fd.append("fbzx", FBZX); fd.append("pageHistory", "0,1,2,3,4,5,6,7");
  try {
    await fetch(FORM, { method: "POST", mode: "no-cors", body: fd });
    try { localStorage.removeItem(KEY); } catch (e) {}
    $("nav").hidden = true; $("contador").textContent = "Enviado";
    $("tela").innerHTML = `<section class="fim"><svg viewBox="0 0 110 155" aria-hidden="true"><path d="M0 0H108V42L97 62 75 77 103 93 110 112V155H3V113L13 93 35 77 8 62 0 42Z"/></svg>
      <h1>Recebido, obrigado!</h1>
      <p class="nota" style="font-size:16px;max-width:46ch">Suas respostas chegaram ao Dr. Luis Felipe. Ele vai ler antes da consulta, para que o encontro comece do ponto em que você está.</p>
      <p class="nota">Dúvidas ou para remarcar: WhatsApp da secretária, (48) 99209-2831.</p>
      <a class="btn sec" href="https://drluisfelipejardimpsiquiatra.github.io/regua-sintomas/consultorio/">Conhecer o consultório</a>
      <p class="crise">Se piorar antes da consulta: <b>188</b> (CVV, 24 horas) ou <b>192</b> (SAMU).</p></section>`;
    window.scrollTo(0, 0);
  } catch (err) {
    b.disabled = false; b.textContent = "Tentar enviar de novo";
    alert("Não foi possível enviar. Confira a internet e tente de novo. Suas respostas continuam salvas neste celular.");
  }
}

/* ---------- eventos ---------- */
document.addEventListener("input", (ev) => {
  const t = ev.target;
  if (t.dataset.e) { if (recLigado && recAlvo == t.dataset.e) { recSessao = ""; recBase = t.value; pararVoz(); } S.resp[t.dataset.e] = t.value; $("c" + t.dataset.e)?.classList.remove("erro"); salvar(); }
  if (t.dataset.outro) { S.resp[t.dataset.outro + ".outro"] = t.value; salvar(); }
});
document.addEventListener("click", (ev) => {
  const mic = ev.target.closest("[data-mic]");
  if (mic) { iniciarVoz(+mic.dataset.mic, mic); return; }
  const op = ev.target.closest("[data-op]");
  if (op) {
    const e = +op.dataset.op, v = op.dataset.v;
    const q = STEPS.flatMap((s) => s.q).find((x) => x.e === e);
    if (q.t === "check") {
      const a = Array.isArray(S.resp[e]) ? S.resp[e] : [];
      S.resp[e] = a.includes(v) ? a.filter((x) => x !== v) : [...a, v];
      op.setAttribute("aria-pressed", S.resp[e].includes(v));
    } else {
      S.resp[e] = S.resp[e] === v ? "" : v;
      op.parentElement.querySelectorAll("[data-op]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.v === S.resp[e]));
    }
    const o = $("outro" + e);
    if (o) o.classList.toggle("vis", Array.isArray(S.resp[e]) ? S.resp[e].includes("__other_option__") : S.resp[e] === "__other_option__");
    if (e === RISCO) $("alertaRisco").classList.toggle("vis", !!S.resp[e] && S.resp[e] !== q.o[0]);
    $("c" + e)?.classList.remove("erro");
    salvar(); return;
  }
  const ed = ev.target.closest("[data-edit]");
  if (ed) { ir(+ed.dataset.edit); return; }
});
$("avancar").onclick = () => {
  if (S.etapa >= TOTAL) return enviar();
  if (!valida(S.etapa)) return;
  ir(S.etapa + 1);
};
$("voltar").onclick = () => { if (S.etapa >= TOTAL) return ir(TOTAL - 1); if (S.etapa <= 0) { pararVoz(); return capa(); } ir(S.etapa - 1); };
capa();
</script>
