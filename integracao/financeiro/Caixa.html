<!doctype html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">

<style>

<body>
<div class="marca-faixa"><svg viewBox="0 0 110 155" aria-hidden="true"><path d="M0 0H108V42L97 62 75 77 103 93 110 112V155H3V113L13 93 35 77 8 62 0 42Z"/></svg><p class="nome">Dr. Luis Felipe Jardim</p><div class="cargo">Caixa do consultório</div></div>
<div class="wrap">
  <h1 id="tit">Caixa</h1>
  <p class="sub-h" id="subt"></p>
  <div class="tabs"><button id="tDia" class="on">Dia</button><button id="tMes">Mês</button><button id="tBusca">Busca ativa</button></div>
  <div id="vDia">
    <div class="nav"><button id="ant" aria-label="Dia anterior">‹</button><input type="date" id="data"><button id="prox" aria-label="Próximo dia">›</button></div>
    <div id="dia"><div class="carregando">Carregando a agenda…</div></div>
  </div>
  <div id="vMes" hidden>
    <div class="nav"><button id="mAnt" aria-label="Mês anterior">‹</button><input type="month" id="mes"><button id="mProx" aria-label="Próximo mês">›</button></div>
    <div id="mesBox"></div>
  </div>
  <div id="vBusca" hidden><div id="buscaBox"></div></div>
  <footer>Os valores vão direto para o controle financeiro do Dr. Luis Felipe.<br>Este link é só seu: não repasse.</footer>
</div>
<script>
const K = <?!= JSON.stringify(k) ?>, CLIN = <?!= JSON.stringify(clin) ?>, MEDICO = <?!= JSON.stringify(medico) ?>, URL_APP = <?!= JSON.stringify(url) ?>;
const PROCS = ["Consulta", "Consulta 1ª vez", "Consulta online", "Infusão de escetamina", "Outro"];
let D = null, ED = null, ocupado = false;
const $ = (id) => document.getElementById(id);
const hojeLocal = () => { const x = new Date(); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0, 10); };
$("data").value = hojeLocal(); $("mes").value = hojeLocal().slice(0, 7);
if (MEDICO) $("subt").insertAdjacentHTML("afterend", '<p class="sub-h"><a style="color:var(--on-bg)" href="' + URL_APP + '?k=' + encodeURIComponent(K) + '">← voltar ao painel</a></p>');

// ---------- dia ----------
async function carregar() {
  ED = null; $("dia").innerHTML = '<div class="carregando">Carregando a agenda…</div>';
  try { D = await call("dia", K, CLIN, $("data").value); render(); }
  catch (e) { $("dia").innerHTML = '<div class="erro">' + esc(msgErro(e)) + "</div>"; }
}
function itens() {
  const porAg = {}; D.lancamentos.forEach((l) => { if (l.agendamento) porAg[l.agendamento] = l; });
  const lista = D.agenda.map((a) => ({ key: "a" + a.id, ag: a, l: porAg[a.id] || null }));
  const naAgenda = {}; D.agenda.forEach((a) => { naAgenda[a.id] = 1; });
  D.lancamentos.filter((l) => !l.agendamento || !naAgenda[l.agendamento]).forEach((l) => lista.push({ key: "l" + l.id, ag: null, l: l }));
  return lista.sort((x, y) => ((x.ag ? x.ag.hora : x.l.hora) || "99").localeCompare((y.ag ? y.ag.hora : y.l.hora) || "99"));
}
function chipLanc(l) {
  if (!l) return "";
  if (l.situacao === "Atendido") {
    const fs = D.formas.filter((f) => l.valores[f] > 0).map((f) => f === "Crédito" && l.parcelas > 1 ? "Crédito " + l.parcelas + "x" : f);
    return '<span class="chip ' + (l.total > 0 ? "c-ok" : "c-mid") + '">' + (l.total > 0 ? R$(l.total) + " · " + fs.join(" + ") : "Atendido sem valor") + "</span>";
  }
  const cls = l.situacao === "Faltou" ? "c-bad" : l.situacao === "Pagar depois" ? "c-mid" : "c-neu";
  return '<span class="chip ' + cls + '">' + esc(l.situacao) + (l.total > 0 ? " · " + R$(l.total) : "") + "</span>";
}
function render() {
  $("tit").textContent = "Caixa · " + D.clinica.nome;
  $("subt").textContent = D.clinica.local + " · " + diaSemana(D.data) + ", " + dBR(D.data);
  const L = itens(), lancados = L.filter((x) => x.l).length;
  const t = totais();
  let h = D.aviso ? '<div class="alerta">' + esc(D.aviso) + "</div>" : "";
  h += '<div class="card"><div class="row"><div><div class="muted">Recebido no dia</div><div class="big">' + R$(t.entradas) + '</div></div><div class="muted" style="text-align:right">' +
    lancados + " de " + L.length + " lançados" + (D.fechamento ? '<br><span class="chip c-ok">Dia fechado</span>' : "") + "</div></div></div>";
  if (!L.length) h += '<div class="card muted">Nenhum paciente na agenda do V Saúde neste dia.</div>';
  L.forEach((x) => {
    const nome = x.ag ? x.ag.paciente : x.l.paciente, hora = x.ag ? x.ag.hora : x.l.hora, proc = x.ag ? x.ag.procedimento : x.l.procedimento;
    const vs = x.ag ? ' · <span class="chip ' + (x.ag.status === 6 ? "c-bad" : "c-neu") + '">V Saúde: ' + esc(x.ag.statusTxt.toLowerCase()) + "</span>" : ' · <span class="chip c-neu">fora da agenda</span>';
    h += '<div class="card it" data-key="' + x.key + '"><div class="row"><div><div class="nome"><span class="hora">' + esc(hora || "") + "</span>" + esc(nome) + '</div><div class="muted">' + esc(proc || "") + vs + "</div></div>" +
      '<div class="dir">' + (x.l ? chipLanc(x.l) + '<br><button class="lnk" data-abrir="' + x.key + '">editar</button>' : '<button class="btn peq" data-abrir="' + x.key + '">Lançar</button>') + "</div></div>" +
      (ED && ED.key === x.key ? editor() : "") + "</div>";
  });
  h += '<div class="card it" data-key="novo">' + (ED && ED.key === "novo" ? "<h2>Paciente fora da agenda</h2>" + editor() : '<button class="btn2" style="width:100%" data-abrir="novo">+ Paciente fora da agenda</button>') + "</div>";
  h += cardSaidas() + cardFechamento(t);
  $("dia").innerHTML = h;
}
function preco(proc, forma) {
  const P = D.precos;
  if (/infus|escetamin|cetamin/i.test(proc || "")) return P["Infusão de escetamina"] || 0;
  if (forma === "Débito") return P["Consulta · Débito"] || 0;
  if (forma === "Crédito") return P["Consulta · Crédito"] || 0;
  return P["Consulta · Pix ou dinheiro"] || 0;
}
function abrir(key) {
  if (key === "novo") { ED = { key: "novo", manual: true, paciente: "", procedimento: "Consulta", situacao: "Atendido", sel: {}, val: {}, parcelas: 1, obs: "" }; render(); return; }
  const x = itens().find((i) => i.key === key); if (!x) return;
  const l = x.l, a = x.ag;
  ED = { key: key, id: l ? l.id : "", agendamento: a ? a.id : (l ? l.agendamento : ""), hora: a ? a.hora : (l ? l.hora : ""), manual: !a,
    paciente: a ? a.paciente : l.paciente, procedimento: a ? a.procedimento : l.procedimento,
    situacao: l ? l.situacao : (a && a.status === 6 ? "Faltou" : "Atendido"), sel: {}, val: {}, parcelas: (l && l.parcelas) || 1, obs: l ? l.obs : "" };
  if (l) D.formas.forEach((f) => { if (l.valores[f] > 0) { ED.sel[f] = true; ED.val[f] = fmtIn(l.valores[f]); } });
  render();
  const el = document.querySelector('[data-key="' + key + '"]'); if (el) el.scrollIntoView({ block: "nearest", behavior: "smooth" });
}
function editor() {
  const e = ED, pagando = e.situacao === "Atendido";
  let h = '<div class="ed">';
  if (e.manual) {
    h += '<label class="l">Paciente</label><input class="f" id="eNome" value="' + esc(e.paciente) + '" placeholder="Nome completo">';
    h += '<label class="l">Procedimento</label><select class="f" id="eProc">' + PROCS.map((p) => "<option" + (p === e.procedimento ? " selected" : "") + ">" + p + "</option>").join("") + "</select>";
  }
  h += '<label class="l">Situação</label><div class="opts">' + D.situacoes.map((s) => '<button type="button" data-sit="' + s + '" class="' + (s === e.situacao ? "on" : "") + '">' + s + "</button>").join("") + "</div>";
  if (pagando) {
    const desc = D.precos["Consulta com desconto"];
    h += '<label class="l">Forma de pagamento (pode marcar mais de uma)</label><div class="opts">' + D.formas.map((f) => '<button type="button" data-forma="' + f + '" class="' + (e.sel[f] ? "on" : "") + '">' + f + "</button>").join("") + "</div>";
    D.formas.filter((f) => e.sel[f]).forEach((f) => {
      h += '<div class="pg"><span class="nm">' + f + '</span><input class="f" inputmode="decimal" data-val="' + f + '" value="' + esc(e.val[f] || "") + '" placeholder="R$">' +
        (f === "Crédito" ? '<select class="f" id="eParc">' + Array.from({ length: 12 }, (_, i) => '<option value="' + (i + 1) + '"' + (+e.parcelas === i + 1 ? " selected" : "") + ">" + (i + 1) + "x</option>").join("") + "</select>" : "<span></span>") + "</div>";
    });
    if (desc && !/infus|escetamin|cetamin/i.test(e.procedimento || "")) h += '<button type="button" class="lnk" id="eDesc" style="color:var(--brand)">Usar valor com desconto (' + R$(desc) + ")</button>";
  } else if (e.situacao === "Pagar depois") h += '<p class="muted">Fica como “a receber” no controle. Quando o paciente pagar, volte aqui, marque “Atendido” e informe o valor.</p>';
  else if (e.situacao === "Pago antes") h += '<p class="muted">Use só se o valor JÁ foi lançado no dia em que o paciente pagou. Se ainda não foi lançado em lugar nenhum, marque “Atendido” com o valor e escreva na observação “pago em dd/mm”.</p>';
  h += '<label class="l">Observação (opcional)</label><textarea class="f" id="eObs" maxlength="300">' + esc(e.obs || "") + "</textarea>";
  h += '<div class="acoes"><button class="btn" id="eSalvar">Salvar</button><button class="lnk" id="eCanc">cancelar</button>' + (e.id ? '<button class="lnk" id="eExc">excluir</button>' : "") + "</div></div>";
  return h;
}
function lerEditor() {
  if (!ED) return;
  if ($("eNome")) ED.paciente = $("eNome").value;
  if ($("eProc")) ED.procedimento = $("eProc").value;
  if ($("eObs")) ED.obs = $("eObs").value;
  if ($("eParc")) ED.parcelas = +$("eParc").value;
  document.querySelectorAll("[data-val]").forEach((i) => { ED.val[i.dataset.val] = i.value; });
}
async function salvar() {
  lerEditor();
  const e = ED, o = { id: e.id, data: D.data, agendamento: e.agendamento || "", hora: e.hora || "", paciente: e.paciente, procedimento: e.procedimento, situacao: e.situacao, parcelas: e.parcelas, obs: e.obs };
  let total = 0;
  if (e.situacao === "Atendido") D.formas.forEach((f) => { o[f] = e.sel[f] ? num(e.val[f]) : 0; total += o[f]; });
  if (e.situacao === "Atendido" && !total && !confirm("Atendido sem valor nenhum. Salvar assim mesmo?")) return;
  await enviar("salvarLancamento", o);
}
async function enviar(fn, ...args) {
  if (ocupado) return; ocupado = true;
  document.querySelectorAll("#dia .btn").forEach((b) => (b.disabled = true));
  try { await call(fn, K, CLIN, ...args); await carregar(); }
  catch (e) { alert(msgErro(e)); document.querySelectorAll("#dia .btn").forEach((b) => (b.disabled = false)); }
  finally { ocupado = false; }
}

// ---------- saídas e fechamento ----------
function totais() {
  const f = {}; D.formas.forEach((x) => (f[x] = 0));
  D.lancamentos.forEach((l) => D.formas.forEach((x) => (f[x] += l.valores[x])));
  const entradas = D.formas.reduce((s, x) => s + f[x], 0), saidas = D.saidas.reduce((s, x) => s + x.valor, 0);
  const saidasDin = D.saidas.filter((x) => x.pagoCom === "Dinheiro do caixa").reduce((s, x) => s + x.valor, 0);
  return { formas: f, entradas, saidas, saidasDin, esperado: f["Dinheiro"] - saidasDin };
}
function cardSaidas() {
  let h = '<div class="card"><h2>Saídas do dia</h2>';
  if (!D.saidas.length) h += '<p class="muted">Nenhuma saída lançada. Ex.: taxa de sala da infusão, faxina, material.</p>';
  D.saidas.forEach((s) => { h += '<div class="sai"><div><b>' + esc(s.categoria) + "</b>" + (s.descricao ? " · " + esc(s.descricao) : "") + '<div class="muted">' + esc(s.pagoCom) + '</div></div><div style="text-align:right"><b>' + R$(s.valor) + '</b><br><button class="lnk" data-excsai="' + esc(s.id) + '">excluir</button></div></div>'; });
  h += '<div class="grid2" style="margin-top:8px"><div><label class="l">Tipo</label><select class="f" id="sCat">' + D.categorias.map((c) => "<option>" + c + "</option>").join("") + "</select></div>" +
    '<div><label class="l">Valor</label><input class="f" id="sVal" inputmode="decimal" placeholder="R$"></div></div>' +
    '<label class="l">Descrição (opcional)</label><input class="f" id="sDesc" maxlength="200" placeholder="Ex.: 3 infusões no hospital">' +
    '<label class="l">Pago com</label><select class="f" id="sPago">' + D.pagoCom.map((c) => "<option>" + c + "</option>").join("") + "</select>" +
    '<div class="acoes"><button class="btn" id="sAdd">Adicionar saída</button></div></div>';
  return h;
}
function cardFechamento(t) {
  const F = D.fechamento;
  let h = '<div class="card"><h2>Fechamento do dia</h2><div class="resumo">' + D.formas.map((f) => "<div>" + f + "<b>" + R$(t.formas[f]) + "</b></div>").join("") +
    "<div><strong>Total recebido</strong><b>" + R$(t.entradas) + "</b></div><div>Saídas<b>" + R$(t.saidas) + "</b></div></div>";
  h += '<p class="muted" style="margin:10px 0 0">Dinheiro que deveria estar na gaveta (dinheiro recebido − saídas pagas com o dinheiro do caixa): <b style="color:var(--ink)">' + R$(t.esperado) + "</b></p>";
  h += '<div class="grid2"><div><label class="l">Dinheiro contado na gaveta</label><input class="f" id="fCont" inputmode="decimal" value="' + (F && F.contado != null ? fmtIn(F.contado) : "") + '" placeholder="R$"></div>' +
    '<div><label class="l">Observação</label><input class="f" id="fObs" maxlength="300" value="' + esc(F ? F.obs : "") + '"></div></div>';
  if (F) h += '<p class="muted">Fechado em ' + esc(F.fechadoEm) + (F.diferenca != null ? ' · diferença <span class="chip ' + (Math.abs(F.diferenca) < 0.01 ? "c-ok" : "c-bad") + '">' + R$(F.diferenca) + "</span>" : "") + ". Se mudar algum lançamento, feche de novo.</p>";
  h += '<div class="acoes"><button class="btn" id="fFechar">' + (F ? "Fechar de novo" : "Fechar o dia") + "</button></div>";
  h += '<div class="sep-foto"><label class="l">Foto do fechamento (vai para a pasta da clínica no Drive do Dr. Luis Felipe)</label>' +
    (D.fotos && D.fotos.length ? '<p class="muted">Enviada' + (D.fotos.length > 1 ? "s " + D.fotos.length + " fotos" : "") + ' ✓</p>' : "") +
    '<input type="file" id="fFoto" accept="image/*" hidden><button class="btn2" id="fFotoBtn" style="width:100%">' + (D.fotos && D.fotos.length ? "Enviar outra foto" : "📷 Enviar foto do fechamento") + "</button></div></div>";
  return h;
}

// ---------- mês ----------
async function carregarMes() {
  $("mesBox").innerHTML = '<div class="carregando">Carregando…</div>';
  try {
    const M = await call("mesClinica", K, CLIN, $("mes").value);
    let h = '<div class="card"><h2>' + esc(mesBR(M.mes)) + '</h2><div class="resumo">' + Object.keys(M.formas).map((f) => "<div>" + f + "<b>" + R$(M.formas[f]) + "</b></div>").join("") +
      "<div><strong>Total recebido</strong><b>" + R$(M.entradas) + "</b></div><div>Saídas<b>" + R$(M.saidas) + "</b></div><div>Atendimentos<b>" + M.atendimentos + "</b></div><div>Faltas<b>" + M.faltas + "</b></div></div></div>";
    h += '<div class="card"><table><tr><th>Dia</th><th class="n">Pac.</th><th class="n">Recebido</th><th class="n">Saídas</th><th>Caixa</th></tr>' +
      (M.dias.length ? M.dias.map((d) => '<tr><td><button class="lnk" style="color:var(--ink)" data-irdia="' + d.data + '">' + dBR(d.data).slice(0, 5) + "</button> " + diaSemana(d.data).slice(0, 3) + '</td><td class="n">' + d.atendimentos + '</td><td class="n">' + R$(d.entradas) + '</td><td class="n">' + R$(d.saidas) + "</td><td>" +
        (d.fechado ? '<span class="chip ' + (d.diferenca && Math.abs(d.diferenca) >= 0.01 ? "c-bad" : "c-ok") + '">' + (d.diferenca && Math.abs(d.diferenca) >= 0.01 ? R$(d.diferenca) : "fechado") + "</span>" : '<span class="chip c-mid">aberto</span>') + "</td></tr>").join("")
        : '<tr><td colspan="5" class="muted">Nada lançado neste mês.</td></tr>') + "</table></div>";
    $("mesBox").innerHTML = h;
  } catch (e) { $("mesBox").innerHTML = '<div class="erro">' + esc(msgErro(e)) + "</div>"; }
}

// ---------- busca ativa ----------
async function carregarBusca() {
  $("buscaBox").innerHTML = '<div class="carregando">Consultando a agenda dos últimos 6 meses…</div>';
  try {
    const B = await call("buscaAtiva", K, CLIN);
    $("buscaBox").innerHTML = '<div class="card"><h2>Pacientes que faltaram 2 ou mais vezes</h2><p class="muted">Últimos 6 meses, pela agenda do V Saúde. Comece por quem faltou nas 2 últimas e por quem está <b>sem retorno marcado</b>: o botão abre o WhatsApp com uma mensagem pronta. Para quem já tem a próxima consulta marcada, confirme a presença na véspera.</p>' +
      htmlBuscaAtiva(B.lista, false) + "</div>";
  } catch (e) { $("buscaBox").innerHTML = '<div class="erro">' + esc(msgErro(e)) + "</div>"; }
}

// ---------- eventos ----------
document.addEventListener("click", (ev) => {
  const t = ev.target.closest("button"); if (!t) return;
  if (t.dataset.abrir) { abrir(t.dataset.abrir); return; }
  if (t.dataset.sit) { lerEditor(); ED.situacao = t.dataset.sit; render(); return; }
  if (t.dataset.forma) {
    lerEditor(); const f = t.dataset.forma; ED.sel[f] = !ED.sel[f];
    const marcadas = D.formas.filter((x) => ED.sel[x]);
    if (ED.sel[f] && marcadas.length === 1 && !ED.val[f]) ED.val[f] = fmtIn(preco(ED.procedimento, f));
    if (!ED.sel[f]) delete ED.val[f];
    render(); const i = document.querySelector('[data-val="' + f + '"]'); if (i && marcadas.length > 1) i.focus(); return;
  }
  if (t.dataset.excsai) { if (confirm("Excluir esta saída?")) enviar("excluirSaida", t.dataset.excsai); return; }
  if (t.dataset.irdia) { $("data").value = t.dataset.irdia; trocaAba("dia"); carregar(); return; }
  switch (t.id) {
    case "eSalvar": salvar(); break;
    case "eDesc": { lerEditor(); const f = D.formas.find((x) => ED.sel[x]) || "Pix"; D.formas.forEach((x) => { if (x !== f) { delete ED.sel[x]; delete ED.val[x]; } });
      ED.sel[f] = true; ED.val[f] = fmtIn(D.precos["Consulta com desconto"]); ED.obs = ED.obs || "Desconto"; render(); break; }
    case "eCanc": ED = null; render(); break;
    case "eExc": if (confirm("Excluir este lançamento?")) enviar("excluirLancamento", ED.id); break;
    case "sAdd": enviar("salvarSaida", { data: D.data, categoria: $("sCat").value, valor: num($("sVal").value), descricao: $("sDesc").value, pagoCom: $("sPago").value }); break;
    case "fFotoBtn": $("fFoto").click(); break;
    case "fFechar": enviar("fecharDia", D.data, $("fCont").value.trim() === "" ? "" : num($("fCont").value), $("fObs").value); break;
    case "ant": $("data").value = somaDias($("data").value, -1); carregar(); break;
    case "prox": $("data").value = somaDias($("data").value, 1); carregar(); break;
    case "mAnt": $("mes").value = somaMes($("mes").value, -1); carregarMes(); break;
    case "mProx": $("mes").value = somaMes($("mes").value, 1); carregarMes(); break;
    case "tDia": trocaAba("dia"); break;
    case "tMes": trocaAba("mes"); carregarMes(); break;
    case "tBusca": trocaAba("busca"); carregarBusca(); break;
  }
});
// reduz a foto no próprio celular (até 1600 px) antes de enviar
function reduzir(arquivo) {
  return new Promise((ok, no) => {
    const img = new Image(), url = URL.createObjectURL(arquivo);
    img.onload = () => { const r = Math.min(1, 1600 / Math.max(img.width, img.height)), cv = document.createElement("canvas");
      cv.width = Math.round(img.width * r); cv.height = Math.round(img.height * r); cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url); ok(cv.toDataURL("image/jpeg", 0.85)); };
    img.onerror = () => no(new Error("Não consegui abrir a foto."));
    img.src = url;
  });
}
document.addEventListener("change", async (ev) => {
  if (ev.target.id === "fFoto" && ev.target.files[0]) {
    const b = $("fFotoBtn"); b.disabled = true; b.textContent = "Enviando a foto…";
    try { await call("enviarFoto", K, CLIN, D.data, await reduzir(ev.target.files[0])); await carregar(); }
    catch (e) { alert(msgErro(e)); b.disabled = false; b.textContent = "📷 Enviar foto do fechamento"; }
    return;
  }
  if (ev.target.id === "data" && ev.target.value) carregar();
  if (ev.target.id === "mes" && ev.target.value) carregarMes();
  if (ev.target.id === "eProc") lerEditor();
});
function trocaAba(a) {
  ["dia", "mes", "busca"].forEach((x) => { const id = x[0].toUpperCase() + x.slice(1); $("v" + id).hidden = a !== x; $("t" + id).classList.toggle("on", a === x); });
}
carregar();
</script>
