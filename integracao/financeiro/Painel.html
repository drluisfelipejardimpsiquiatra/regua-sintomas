<!doctype html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<?!= include("Estilo"); ?>
<style>
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.kpi{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow-card)}
.kpi .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .s{font-size:12px;color:var(--soft);margin-top:2px}
.clins{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.clins .card{margin:0}
.clins h2{margin-bottom:2px}
.linha{display:flex;justify-content:space-between;gap:8px;padding:4px 0;font-size:14px}
.linha span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.linha.ind{padding-left:12px;color:var(--soft);font-size:13px}
.linha.tot{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:800;font-size:16px}
.sep{height:1px;background:var(--line);margin:6px 0}
.neg{color:var(--bad-text)}
.barra{height:8px;border-radius:4px;background:var(--brand-soft);overflow:hidden;display:flex;margin:6px 0 2px}
.barra i{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--soft)}
.leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
@media (max-width:860px){.clins{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="marca-faixa"><svg viewBox="0 0 110 155" aria-hidden="true"><path d="M0 0H108V42L97 62 75 77 103 93 110 112V155H3V113L13 93 35 77 8 62 0 42Z"/></svg><p class="nome">Dr. Luis Felipe Jardim</p><div class="cargo">Financeiro do consultório</div></div>
<div class="wrap largo">
  <h1>Painel financeiro</h1>
  <p class="sub-h">Praia Grande, Sombrio (Cardiovitta) e Torres (Vida Multiclínica) somados. Só este link vê tudo.</p>
  <div class="nav" style="max-width:420px"><button id="mAnt" aria-label="Mês anterior">‹</button><input type="month" id="mes"><button id="mProx" aria-label="Próximo mês">›</button></div>
  <div id="box"><div class="carregando">Calculando o mês…</div></div>
  <footer>Custos fixos e preços: abas “Custos fixos” e “Preços” da planilha.</footer>
</div>
<script>
const K = <?!= JSON.stringify(k) ?>, URL_APP = <?!= JSON.stringify(url) ?>;
const $ = (id) => document.getElementById(id);
const CORES = { "Pix": "#38584B", "Dinheiro": "#88764F", "Débito": "#E89925", "Crédito": "#C3622D" };
const hojeLocal = () => { const x = new Date(); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0, 10); };
$("mes").value = hojeLocal().slice(0, 7);
const linha = (a, b, cls) => '<div class="linha ' + (cls || "") + '"><span>' + a + "</span><span>" + b + "</span></div>";
const barra = (formas, total) => '<div class="barra">' + Object.keys(formas).map((f) => formas[f] > 0 ? '<i style="width:' + (formas[f] / total * 100) + "%;background:" + CORES[f] + '" title="' + f + '"></i>' : "").join("") + "</div>" +
  '<div class="leg">' + Object.keys(formas).filter((f) => formas[f] > 0).map((f) => "<span><i style=\"background:" + CORES[f] + "\"></i>" + f + " " + Math.round(formas[f] / total * 100) + "%</span>").join("") + "</div>";

async function carregar() {
  $("box").innerHTML = '<div class="carregando">Calculando o mês…</div>';
  try { render(await call("painel", K, $("mes").value)); }
  catch (e) { $("box").innerHTML = '<div class="erro">' + esc(msgErro(e)) + "</div>"; }
}
function render(P) {
  const T = P.total, margem = T.entradas ? Math.round(T.resultado / T.entradas * 100) : 0;
  let h = '<div class="kpis">' +
    '<div class="kpi"><div class="muted">Entradas</div><div class="v">' + R$(T.entradas) + '</div><div class="s">' + esc(mesBR(P.mes)) + "</div></div>" +
    '<div class="kpi"><div class="muted">Custos e saídas</div><div class="v">' + R$(T.custos) + '</div><div class="s">fixos + taxa de infusão + caixa</div></div>' +
    '<div class="kpi"><div class="muted">Resultado</div><div class="v' + (T.resultado < 0 ? " neg" : "") + '">' + R$(T.resultado) + '</div><div class="s">margem ' + margem + "%</div></div>" +
    '<div class="kpi"><div class="muted">Atendimentos</div><div class="v">' + T.atendimentos + '</div><div class="s">' + T.infusoes + " infusões · ticket médio " + R$(T.atendimentos ? T.entradas / T.atendimentos : 0) + "</div></div></div>";
  if (T.entradas) h += '<div class="card">' + linha("<b>Por forma de pagamento</b>", "") + barra(T.formas, T.entradas) + "</div>";

  h += '<div class="clins">';
  P.clinicas.forEach((c) => {
    h += '<div class="card"><h2>' + esc(c.nome) + '</h2><div class="muted">' + esc(c.local) + "</div>";
    h += linha("<b>Entradas</b>", "<b>" + R$(c.entradas) + "</b>");
    Object.keys(c.formas).forEach((f) => { if (c.formas[f]) h += linha(f, R$(c.formas[f]), "ind"); });
    if (c.entradas) h += barra(c.formas, c.entradas);
    h += linha("Atendimentos", c.atendimentos + (c.infusoes ? " (" + c.infusoes + " infusões)" : "")) +
      (c.faltas ? linha("Faltas lançadas", c.faltas, "ind") : "") + (c.aReceber ? linha("A receber (pagar depois)", c.aReceber, "ind") : "");
    h += '<div class="sep"></div>' + linha("<b>Custos</b>", "<b>" + R$(c.custos) + "</b>");
    c.fixos.forEach((f) => { h += linha(esc(f.descricao), f.valor == null ? '<span class="chip c-mid">preencher</span>' : R$(f.valor), "ind"); });
    if (c.infusoes || c.taxaPagaCaixa) h += linha("Taxa de sala · " + c.infusoes + " × " + R$(c.taxaPorInfusao), R$(c.taxaDevida), "ind") +
      (c.taxaPagaCaixa ? linha("↳ já paga pelo caixa", R$(c.taxaPagaCaixa), "ind") : "");
    if (c.saidasOutras) Object.keys(c.saidasPorCategoria).filter((k) => k !== "Taxa de sala · infusão").forEach((k) => { h += linha("Caixa · " + esc(k), R$(c.saidasPorCategoria[k]), "ind"); });
    h += linha("Resultado", '<span class="' + (c.resultado < 0 ? "neg" : "") + '">' + R$(c.resultado) + "</span>", "tot");
    h += '<a class="lnk" style="display:inline-block;margin-top:8px"  href="' + URL_APP + '?k=' + encodeURIComponent(K) + "&c=" + c.cod + '">Abrir o caixa desta clínica →</a></div>';
  });
  h += "</div>";

  // faltas pela agenda do V Saúde
  const tx = (f) => f.atendidos + f.faltas ? Math.round(f.faltas / (f.atendidos + f.faltas) * 100) + "%" : "—";
  h += '<div class="card"><h2>Faltas no mês (agenda do V Saúde)</h2><div class="rol"><table><tr><th>Clínica</th><th class="n">Atendidos</th><th class="n">Faltas</th><th class="n">Taxa</th><th class="n">Acompanhamento</th><th class="n">1ª vez</th><th class="n">Infusão</th><th class="n">Receita potencial perdida</th></tr>';
  P.clinicas.forEach((c) => { const F = c.faltasVS, t = (n) => { const x = F.porTipo.find((y) => y.tipo === n); return x ? tx(x) + ' <span class="muted">(' + x.faltas + ")</span>" : "—"; };
    h += "<tr><td>" + esc(c.nome) + '</td><td class="n">' + F.atendidos + '</td><td class="n">' + F.faltas + '</td><td class="n"><b>' + tx(F) + '</b></td><td class="n">' + t("Acompanhamento") + '</td><td class="n">' + t("1ª vez") + '</td><td class="n">' + t("Infusão") + '</td><td class="n">' + R$(F.perdida) + "</td></tr>"; });
  h += '<tr class="tot"><td>Total</td><td class="n">' + T.atendidosVS + '</td><td class="n">' + T.faltasVS + '</td><td class="n">' + tx({ atendidos: T.atendidosVS, faltas: T.faltasVS }) + '</td><td></td><td></td><td></td><td class="n">' + R$(T.perdida) + "</td></tr></table></div>" +
    '<p class="muted">Conta o que o V Saúde marcou como “não compareceu” até agora. Receita perdida = faltas × preço de tabela (consulta Pix ou infusão); é potencial, parte dos horários vira encaixe.</p></div>';
  h += '<div class="card"><h2>Busca ativa (' + P.buscaAtiva.length + ')</h2><p class="muted">Pacientes com 2 ou mais faltas nos últimos 6 meses. Primeiro quem faltou nas 2 últimas e quem está sem retorno marcado. Cada secretária vê a lista da própria clínica.</p>' + htmlBuscaAtiva(P.buscaAtiva, true) + "</div>";
  h += '<div class="card"><h2>Pendências (' + P.pendencias.length + ')</h2>';
  h += P.pendencias.length ? '<div class="rol"><table><tr><th>Clínica</th><th>Data</th><th>Paciente</th><th>O que falta</th></tr>' +
    P.pendencias.map((p) => "<tr><td>" + esc(p.clinica) + "</td><td>" + dBR(p.data).slice(0, 5) + (p.hora ? " " + esc(p.hora) : "") + "</td><td>" + esc(p.paciente) + (p.procedimento ? '<div class="muted">' + esc(p.procedimento) + "</div>" : "") + "</td><td>" + esc(p.motivo) + "</td></tr>").join("") + "</table></div>"
    : '<p class="muted">Nada pendente: tudo o que estava na agenda até hoje foi lançado.</p>';
  h += '<p class="muted">Conferência da agenda do V Saúde a partir de ' + dBR(P.inicio) + ', início do sistema.</p>';
  h += "</div>";

  const dias = {}; P.clinicas.forEach((c) => c.dias.forEach((d) => { (dias[d.data] = dias[d.data] || {})[c.nome] = d; }));
  const ds = Object.keys(dias).sort();
  h += '<div class="card"><h2>Dia a dia</h2><div class="rol"><table><tr><th>Dia</th>' + P.clinicas.map((c) => '<th class="n">' + esc(c.nome) + "</th>").join("") + '<th class="n">Total</th></tr>';
  ds.forEach((d) => {
    let t = 0; h += "<tr><td>" + dBR(d).slice(0, 5) + " " + diaSemana(d).slice(0, 3) + "</td>";
    P.clinicas.forEach((c) => { const x = dias[d][c.nome]; t += x ? x.entradas : 0; h += '<td class="n">' + (x ? R$(x.entradas) + (x.fechado ? "" : ' <span class="chip c-mid" title="caixa não fechado">!</span>') : "—") + "</td>"; });
    h += '<td class="n"><b>' + R$(t) + "</b></td></tr>";
  });
  if (!ds.length) h += '<tr><td colspan="5" class="muted">Nada lançado neste mês.</td></tr>';
  else h += '<tr class="tot"><td>Total</td>' + P.clinicas.map((c) => '<td class="n">' + R$(c.entradas) + "</td>").join("") + '<td class="n">' + R$(T.entradas) + "</td></tr>";
  h += '</table></div><p class="muted"><a style="color:var(--brand)" href="' + esc(P.planilha) + '" target="_blank" rel="noopener">Abrir a planilha completa</a></p></div>';
  $("box").innerHTML = h;
}
document.addEventListener("click", (ev) => {
  const t = ev.target.closest("button"); if (!t) return;
  if (t.id === "mAnt") { $("mes").value = somaMes($("mes").value, -1); carregar(); }
  if (t.id === "mProx") { $("mes").value = somaMes($("mes").value, 1); carregar(); }
});
$("mes").addEventListener("change", () => { if ($("mes").value) carregar(); });
carregar();
</script>
</body>
</html>
